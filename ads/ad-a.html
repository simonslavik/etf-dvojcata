<!doctype html><html lang="cs"><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
.phone { margin: 56px 0 0; background: #fff; border-radius: 34px; border: 2px solid #ddd6c8; box-shadow: 0 30px 60px -30px rgba(15,47,44,.45); padding: 34px; }
.search { display: flex; align-items: center; gap: 18px; background: #f5f2eb; border-radius: 18px; padding: 22px 26px; font-size: 34px; color: #5b6764; }
.search b { color: #0f2f2c; }
.row { display: flex; align-items: center; justify-content: space-between; padding: 30px 6px 4px; }
.t { font-size: 64px; }
.no .t { color: #8a8273; text-decoration: line-through; text-decoration-color: #b23a2e; text-decoration-thickness: 6px; }
.badge { font: 800 24px/1 "Hanken Grotesk"; letter-spacing: .06em; text-transform: uppercase; padding: 14px 18px; border-radius: 12px; }
.badge.no { background: #f6e3df; color: #b23a2e; }
.badge.yes { background: #fff; color: #217a52; border: 2px solid #bcd5d1; }
.sub { font-size: 26px; color: #5b6764; padding: 6px 6px 0; }
.arrow { display: flex; align-items: center; gap: 14px; color: #2f6b66; font: 700 28px/1 "Hanken Grotesk"; padding: 26px 6px 0; }
.yes-box { margin-top: 18px; background: #e3eeec; border: 2px solid #bcd5d1; border-radius: 22px; padding: 6px 22px 24px; }
.more { margin-top: 34px; font: 700 30px/1.3 "Hanken Grotesk"; color: #2f6b66; }
</style></head><body><div class="grid"></div>
<div class="pad">
  <p class="eyebrow">Pro investory z Česka</p>
  <h1>Chtěli jste koupit VOO? <em>Broker ho nenabízí.</em></h1>
  <div class="phone">
    <div class="search"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#5b6764" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span>Hledat: <b class="mono">VOO</b></span></div>
    <div class="row no"><span class="t mono">VOO</span><span class="badge no">Nedostupné v EU</span></div>
    <p class="sub">Vanguard S&amp;P 500 ETF · NYSE Arca</p>
    <div class="arrow"><svg width="34" height="34" viewBox="0 0 20 20"><path d="M10 3v13m-5-5 5 5 5-5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg> jeho evropské dvojče</div>
    <div class="yes-box">
      <div class="row"><span class="t mono">VUAA</span><span class="badge yes">Koupíte</span></div>
      <p class="sub">Stejný index S&amp;P 500 · <span class="mono" style="color:#0f2f2c">IE00BFMXXD54</span></p>
    </div>
  </div>
  <p class="more">+ dalších 11 amerických ETF: SPY, IVV, VTI, VT, SCHD…</p>
</div>
<div class="foot"><div class="logo"><svg width="48" height="48" viewBox="0 0 32 32"><rect x="3" y="7" width="16" height="16" rx="4" fill="none" stroke="#0f2f2c" stroke-width="2.4"/><rect x="13" y="11" width="16" height="16" rx="4" fill="#b23a2e"/></svg><span>ETF<b>dvojčata</b></span></div><div class="cta">Najít dvojče →</div></div>
</body></html>
