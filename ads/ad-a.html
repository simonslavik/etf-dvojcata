<!doctype html><html lang="cs"><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
.phone { margin: 56px 0 0; background: #fff; border-radius: 34px; border: 2px solid #dbe5e2; box-shadow: 0 30px 60px -30px rgba(22,59,59,.45); padding: 34px; }
.search { display: flex; align-items: center; gap: 18px; background: #f5f8f7; border-radius: 18px; padding: 22px 26px; font-size: 34px; color: #5d6f6e; }
.search b { color: #163b3b; }
.row { display: flex; align-items: center; justify-content: space-between; padding: 30px 6px 4px; }
.t { font-size: 64px; }
.no .t { color: #5d6f6e; text-decoration: line-through; text-decoration-color: #a63d36; text-decoration-thickness: 6px; }
.badge { font: 700 24px/1 "Lexend"; letter-spacing: .06em; text-transform: uppercase; padding: 14px 18px; border-radius: 12px; }
.badge.no { background: #fbefed; color: #a63d36; }
.badge.yes { background: #fff; color: #2e7a4f; border: 2px solid #c9dbd8; }
.sub { font-size: 26px; color: #5d6f6e; padding: 6px 6px 0; }
.arrow { display: flex; align-items: center; gap: 14px; color: #275e5d; font: 700 28px/1 "Lexend"; padding: 26px 6px 0; }
.yes-box { margin-top: 18px; background: #e2ecea; border: 2px solid #c9dbd8; border-radius: 22px; padding: 6px 22px 24px; }
.more { margin-top: 34px; font: 700 30px/1.3 "Lexend"; color: #275e5d; }
</style></head><body><div class="grid"></div>
<div class="pad">
  <p class="eyebrow">Pro investory z Česka</p>
  <h1>Chtěli jste koupit VOO? <em>Broker ho nenabízí.</em></h1>
  <div class="phone">
    <div class="search"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#5d6f6e" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span>Hledat: <b class="mono">VOO</b></span></div>
    <div class="row no"><span class="t mono">VOO</span><span class="badge no">Nedostupné v EU</span></div>
    <p class="sub">Vanguard S&amp;P 500 ETF · NYSE Arca</p>
    <div class="arrow"><svg width="34" height="34" viewBox="0 0 20 20"><path d="M10 3v13m-5-5 5 5 5-5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg> jeho evropské dvojče</div>
    <div class="yes-box">
      <div class="row"><span class="t mono">VUAA</span><span class="badge yes">Koupíte</span></div>
      <p class="sub">Stejný index S&amp;P 500 · <span class="mono" style="color:#163b3b">IE00BFMXXD54</span></p>
    </div>
  </div>
  <p class="more">+ dalších 11 amerických ETF: SPY, IVV, VTI, VT, SCHD…</p>
</div>
<div class="foot"><div class="logo"><svg width="48" height="48" viewBox="0 0 32 32"><rect x="3" y="6" width="17" height="17" rx="5" fill="#1d4a4a"/><rect x="12" y="10" width="17" height="17" rx="5" fill="#a63d36" fill-opacity=".92"/></svg><span>ETF <b>dvojčata</b></span></div><div class="cta">Najít dvojče →</div></div>
</body></html>
