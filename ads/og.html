<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="size" content="1200x630"><link rel="stylesheet" href="_base.css">
<style>
html, body { width: 1200px; height: 630px; }
.pad { padding: 64px 72px; display: grid; grid-template-columns: 1.15fr 1fr; gap: 48px; align-items: center; height: 100%; }
h1 { font-size: 72px; }
.eyebrow { font-size: 20px; margin-bottom: 18px; }
.pair { display: grid; gap: 16px; }
.box { border-radius: 22px; padding: 22px 26px; font: 700 52px/1 "JetBrains Mono", monospace; display: flex; justify-content: space-between; align-items: center; }
.box small { font: 800 18px/1 "Hanken Grotesk"; letter-spacing: .06em; text-transform: uppercase; padding: 10px 12px; border-radius: 10px; }
.us { background: #fffdf9; border: 2px dashed #c9bfae; color: #8a8273; }
.us span { text-decoration: line-through; text-decoration-color: #b23a2e; text-decoration-thickness: 5px; }
.us small { background: #f6e3df; color: #b23a2e; }
.eu { background: #e3eeec; border: 2px solid #bcd5d1; color: #0f2f2c; }
.eu small { background: #fff; color: #217a52; }
</style></head><body><div class="grid"></div>
<div class="pad">
  <div><p class="eyebrow">ETF dvojčata · zdarma</p><h1>VOO si v Česku nekoupíte. <em>Jeho dvojče ano.</em></h1></div>
  <div class="pair">
    <div class="box us"><span>VOO</span><small>V EU ne</small></div>
    <div class="box eu"><span>VUAA</span><small>Koupíte</small></div>
    <div class="box us"><span>VT</span><small>V EU ne</small></div>
    <div class="box eu"><span>VWCE</span><small>Koupíte</small></div>
  </div>
</div>
</body></html>
